name: Generate All Profile Assets

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/source/**'
      - 'scripts/**'
      - '.github/workflows/generate-assets.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy requests

      - name: Run dotify.py (portrait)
        run: |
          if [ -f scripts/dotify.py ]; then
            python scripts/dotify.py assets/source/mrr.png -o assets/portrait --square --focus 0.5,0.42 --equalize --detail 0.5 --reveal
          else
            echo "dotify.py not found, skipping"
          fi

      - name: Run banner generator
        run: |
          if [ -f scripts/banner/generate.py ]; then
            python scripts/banner/generate.py
          elif [ -f scripts/banner.py ]; then
            python scripts/banner.py
          else
            echo "banner script not found, skipping"
          fi

      - name: Run card.py
        run: |
          if [ -f scripts/card.py ]; then
            python scripts/card.py
          else
            echo "card.py not found, skipping"
          fi

      - name: Run radar.py
        run: |
          if [ -f scripts/radar.py ]; then
            python scripts/radar.py
          else
            echo "radar.py not found, skipping"
          fi

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "chore: regenerate profile assets [skip ci]"
          git push